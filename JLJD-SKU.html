<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Image Border Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        .header h1 { font-size: 22px; color: #333; }
        .header p { font-size: 14px; color: #999; margin-top: 5px; }
        .upload-area {
            background: #fff;
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .upload-area:active { background: #f0f0f0; border-color: #007AFF; }
        .upload-area p { color: #666; font-size: 14px; }
        .upload-area .sub { color: #999; font-size: 12px; margin-top: 4px; }
        .upload-area input { display: none; }
        .form-group {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .form-group input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        .range-value {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #007AFF;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn:active { background: #0056b3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #34C759; }
        .editor-container {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #eee;
            background: #f8f8f8;
        }
        #editorCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .preview {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }
        .preview img {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }
        .download-btn {
            width: 100%;
            padding: 15px;
            background: #34C759;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            display: none;
        }
        .status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #666;
        }
        .status.ok { color: #34C759; }
    </style>
</head>
<body>
    <div class="header">
        <h1>金龄价到产品卡制作</h1>
        <p>阿布出品</p>
    </div>

    <div class="status" id="templateStatus">正在加载边框模板...</div>

    <div class="upload-area" onclick="document.getElementById('productInput').click()">
        <p>点击上传产品图</p>
        <p class="sub">支持 PNG、JPG 格式</p>
        <input type="file" id="productInput" accept="image/*" onchange="handleProductUpload(event)">
    </div>
    <div class="status" id="productStatus">未选择产品图</div>

    <div class="form-group">
        <label>产品名称</label>
        <input type="text" id="productName" value="产品名称">
        <label style="margin-top: 10px;">文字大小</label>
        <input type="range" id="nameSize" min="20" max="60" value="36">
        <div class="range-value" id="nameSizeValue">36px</div>
        <label style="margin-top: 10px;">文字左右位置</label>
        <input type="range" id="nameX" min="0" max="800" value="400">
        <div class="range-value" id="nameXValue">居中</div>
        <label style="margin-top: 10px;">文字上下位置</label>
        <input type="range" id="nameY" min="0" max="100" value="80">
        <div class="range-value" id="nameYValue">距底部80px</div>
    </div>

    <button class="btn" id="generateBtn" onclick="showEditor()" disabled>进入编辑器</button>

    <div class="editor-container" id="editorArea">
        <p>拖拽移动，滚轮缩放</p>
        <div class="canvas-wrapper">
            <canvas id="editorCanvas" width="800" height="800"></canvas>
        </div>
        <div class="form-group">
            <label>产品图缩放</label>
            <input type="range" id="productScale" min="10" max="1000" value="100">
            <div class="range-value" id="productScaleValue">100%</div>
        </div>
        <button class="btn btn-secondary" onclick="generateFinal()">生成最终图片</button>
    </div>

    <div class="preview" id="previewArea">
        <p>最终效果</p>
        <img id="previewImg" src="" alt="预览">
    </div>

    <button class="download-btn" id="downloadBtn" onclick="downloadImage()">下载图片</button>

        function loadTemplate() {
            templateImage = new Image();
            templateImage.onload = function() {
                document.getElementById('templateStatus').innerHTML = '边框模板已加载 (' + templateImage.width + 'x' + templateImage.height + ')';
                document.getElementById('templateStatus').className = 'status ok';
                checkReady();
            };
            templateImage.onerror = function() {
                document.getElementById('templateStatus').innerHTML = '模板加载失败';
            };
            templateImage.src = 'data:image/png;base64,' + templateBase64;
        }

        function handleProductUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                productImage = new Image();
                productImage.onload = function() {
                    document.getElementById('productStatus').innerHTML = '产品图已加载 (' + productImage.width + 'x' + productImage.height + ')';
                    document.getElementById('productStatus').className = 'status ok';
                    checkReady();
                };
                productImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function checkReady() {
            if (templateImage && productImage) {
                document.getElementById('generateBtn').disabled = false;
            }
        }

        function showEditor() {
            if (!templateImage || !productImage) {
                alert('请先上传产品图');
                return;
            }

            document.getElementById('editorArea').style.display = 'block';
            document.getElementById('editorArea').scrollIntoView({ behavior: 'smooth' });

            canvas = document.getElementById('editorCanvas');
            ctx = canvas.getContext('2d');

            productX = (800 - productImage.width) / 2;
            productY = (800 - productImage.height) / 2 - 50;
            productScale = 1;

            bindEvents();
            drawEditor();
        }

        function bindEvents() {
            canvas.addEventListener('mousedown', function(e) {
                isDragging = true;
                const rect = canvas.getBoundingClientRect();
                lastX = (e.clientX - rect.left) * (800 / rect.width);
                lastY = (e.clientY - rect.top) * (800 / rect.height);
            });

            canvas.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (800 / rect.width);
                const y = (e.clientY - rect.top) * (800 / rect.height);
                productX += x - lastX;
                productY += y - lastY;
                lastX = x;
                lastY = y;
                drawEditor();
            });

            canvas.addEventListener('mouseup', function() { isDragging = false; });
            canvas.addEventListener('mouseleave', function() { isDragging = false; });

            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                productScale = Math.max(0.1, Math.min(3, productScale * delta));
                document.getElementById('productScale').value = Math.round(productScale * 100);
                document.getElementById('productScaleValue').textContent = Math.round(productScale * 100) + '%';
                drawEditor();
            });

            document.getElementById('productScale').addEventListener('input', function(e) {
                productScale = e.target.value / 100;
                document.getElementById('productScaleValue').textContent = e.target.value + '%';
                drawEditor();
            });

            document.getElementById('nameSize').addEventListener('input', function(e) {
                document.getElementById('nameSizeValue').textContent = e.target.value + 'px';
                drawEditor();
            });

            document.getElementById('nameX').addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                let text = val + 'px';
                if (val === 400) text = '居中';
                else if (val < 400) text = '偏左' + (400 - val) + 'px';
                else text = '偏右' + (val - 400) + 'px';
                document.getElementById('nameXValue').textContent = text;
                drawEditor();
            });

            document.getElementById('nameY').addEventListener('input', function(e) {
                document.getElementById('nameYValue').textContent = '距底部' + e.target.value + 'px';
                drawEditor();
            });
        }

        function drawEditor() {
            if (!ctx || !templateImage || !productImage) return;

            ctx.clearRect(0, 0, 800, 800);

            const drawWidth = productImage.width * productScale;
            const drawHeight = productImage.height * productScale;
            ctx.drawImage(productImage, productX, productY, drawWidth, drawHeight);

            ctx.drawImage(templateImage, 0, 0, 800, 800);

            const productName = document.getElementById('productName').value || 'Product Name';
            const nameSize = parseInt(document.getElementById('nameSize').value) || 36;
            const nameY = parseInt(document.getElementById('nameY').value) || 80;
            ctx.font = 'bold ' + nameSize + 'px sans-serif';
            ctx.fillStyle = '#FF0000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const nameX = parseInt(document.getElementById('nameX').value) || 400;
            ctx.fillText(productName, nameX, 800 - nameY);
        }

        function generateFinal() {
            if (!templateImage || !productImage) {
                alert('Please upload product image first');
                return;
            }

            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 800;
            finalCanvas.height = 800;
            const finalCtx = finalCanvas.getContext('2d');

            const drawWidth = productImage.width * productScale;
            const drawHeight = productImage.height * productScale;
            finalCtx.drawImage(productImage, productX, productY, drawWidth, drawHeight);
            finalCtx.drawImage(templateImage, 0, 0, 800, 800);

            const productName = document.getElementById('productName').value || 'Product Name';
            const nameSize = parseInt(document.getElementById('nameSize').value) || 36;
            const nameY = parseInt(document.getElementById('nameY').value) || 80;
            finalCtx.font = 'bold ' + nameSize + 'px sans-serif';
            finalCtx.fillStyle = '#FF0000';
            finalCtx.textAlign = 'center';
            finalCtx.textBaseline = 'middle';
            const finalNameX = parseInt(document.getElementById('nameX').value) || 400;
            finalCtx.fillText(productName, finalNameX, 800 - nameY);

            finalImageData = finalCanvas.toDataURL('image/png');

            document.getElementById('previewImg').src = finalImageData;
            document.getElementById('previewArea').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
            document.getElementById('previewArea').scrollIntoView({ behavior: 'smooth' });
        }

        function downloadImage() {
            if (!finalImageData) {
                alert('Please generate image first');
                return;
            }
            const link = document.createElement('a');
            link.href = finalImageData;
            link.download = 'product.png';
            link.click();
        }

        window.onload = function() {
            loadTemplate();
        };
    </script>
